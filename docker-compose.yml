version: '3.8'

services:
  mailserver:
    build: .
    image: mailsource:latest
    container_name: mailsource-mta
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - INBOUND_PORT=${INBOUND_PORT:-25}
      - CONCURRENCY=25
      - HELO_HOST=${HELO_HOST:-mail.exauraa.com}
      - API_PASSWORD=${API_PASSWORD:-ar@51/er}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
    volumes:
      - ./data:/app/data
      - ./config:/app/config

