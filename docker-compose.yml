version: '3.8'

services:
  mailserver:
    build: .
    image: mailsource:latest
    container_name: mailsource-mta
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INBOUND_PORT=25
      - CONCURRENCY=25
      - HELO_HOST=mail.exauraa.com
      # Set your secret API password below:
      - API_PASSWORD=sec_change_this_to_a_secure_password
    volumes:
      - ./data:/app/data
      - ./config:/app/config
